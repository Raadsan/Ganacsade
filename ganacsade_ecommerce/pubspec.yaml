name: ganacsade
description: "GANACSADE - Premium Somali E-commerce Platform"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  card_swiper: ^3.0.1
  
  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  get: ^4.6.6
  
  # Networking & Data
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Storage & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  
  # Authentication & Security
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  google_sign_in: ^6.2.2
  
  # Localization
  intl: ^0.20.2
  
  # Payment Integration
  # flutter_stripe: ^10.1.1
  
  # Maps & Location
  # google_maps_flutter: ^2.5.3
  # geolocator: ^10.1.0
  
  # Media & Files
  image_picker: ^1.0.7
  # file_picker: ^6.1.1
  
  # Audio
  audioplayers: ^6.1.0
  
  # Utilities
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^18.0.1
  
  # Icons & UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  iconly: ^1.0.1
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Code Generation
  freezed_annotation: ^2.4.1
  
  # HTTP & API
  http: ^1.1.2
  
  # Local Database
  sqflite: ^2.3.0
  
  # Device Info
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  
  # App Icon Generation
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/
    - assets/audio/
  
  # Fonts for Arabic/Somali support
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated
  output_localization_file: app_localizations.dart
  template_arb_file: app_en.arb
  output_class: AppLocalizations

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/IconKitchen-Output/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  web:
    generate: true
    image_path: "assets/logos/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/logos/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logos/logo.png"
